protocol: find
# --- Global Simulation Settings ---
# Number of simulation runs to execute in parallel
num_simulations: 1000
# Fixed random seed for reproducibility (use null or remove for random seed)
random_seed: 42
# Clock ticks per second
clock_frequency: 1000
# Scaling factor for energy values read from file (if needed)
energy_scaling_factor: 1e-2
# Default power factor used for calculating energy needs if 'power: default' is set
default_power_factor: 0.5
# Logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
log_level: INFO

# --- Per-Protocol Settings ---
# Number of nodes for EACH protocol (e.g., 5 'ours' and 5 'baseline')
num_nodes: 5
# Duration of each simulation run in terms of nominal cycles
num_cycles: 1000

# --- Node Specific Settings ---
# Configuration for the first node instance of each protocol type
node1:
  alpha: 0.7
  capacitance: 17.0e-6 # Effective (voltage-derated) capacitance (Farads)
  von: 3.0             # Turn-on voltage (Volts)
  voff: 2.4
  v_max_thr: 3.3            # Turn-off voltage (Volts)
  eadv: 14.0e-6        # Energy cost of advertisement (Joules)
  escan: 45e-9         # Energy cost of scanning (GPIO-gated scan circuit) (Joules)
  esleep: 14.4e-9        # Energy cost of a sleep tick (System ON idle + 1 kHz wake) (Joules)
  ebusy_wait: 9.9e-6   # Energy cost of an active-discharge (busy-wait) slot (Joules)
  nominal_runtime: 1000 # Nominal time slots for one charge/discharge cycle
  runtype: normal      # Behavior override for 'ours' protocol (normal, advertising, scanning)
  harvester:
    harvesting_mode: file # constant, gaussian, or file
    file: "../EnergyTraces/pwr_office.h5"

